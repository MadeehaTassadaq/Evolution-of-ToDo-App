openapi: 3.1.0
info:
  title: Todo AI Chatbot - ChatKit API
  version: 1.0.0
  description: |
    ChatKit-compatible API for the Todo AI Chatbot.
    This API follows the OpenAI ChatKit protocol for self-hosted backends.

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.example.com
    description: Production server

security:
  - BearerAuth: []

paths:
  /api/v1/chatkit:
    post:
      summary: ChatKit Protocol Endpoint
      description: |
        Main ChatKit endpoint that handles all chat protocol messages.
        Supports thread creation, message sending, and streaming responses.
      operationId: chatkit
      tags:
        - ChatKit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatKitRequest'
      responses:
        '200':
          description: Successful response (JSON or SSE stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatKitResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream of ThreadStreamEvent items
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login:
    post:
      summary: User Login
      description: Authenticate user and return JWT token
      operationId: login
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/register:
    post:
      summary: User Registration
      description: Create a new user account
      operationId: register
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /api/v1/auth/login

  schemas:
    # ChatKit Protocol Schemas
    ChatKitRequest:
      type: object
      description: ChatKit protocol request (varies by action type)
      properties:
        action:
          type: string
          enum:
            - create_thread
            - send_message
            - list_threads
            - get_thread
            - list_items
            - delete_thread
        thread_id:
          type: string
          format: uuid
        message:
          $ref: '#/components/schemas/UserMessage'
        cursor:
          type: string
        limit:
          type: integer
          default: 20

    ChatKitResponse:
      type: object
      description: ChatKit protocol response
      properties:
        thread:
          $ref: '#/components/schemas/Thread'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadItem'
        has_more:
          type: boolean
        next_cursor:
          type: string

    Thread:
      type: object
      description: ChatKit thread (conversation)
      required:
        - id
        - created_at
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        metadata:
          type: object

    ThreadItem:
      type: object
      description: A message in a thread
      required:
        - id
        - type
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [user_message, assistant_message, tool_status]
        created_at:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: '#/components/schemas/MessageContent'
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'

    UserMessage:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          maxLength: 10000
          description: User's message text

    MessageContent:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string

    ToolCall:
      type: object
      properties:
        id:
          type: string
        tool_name:
          type: string
        parameters:
          type: object
        result:
          type: object

    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        user_id:
          type: string
          format: uuid
        username:
          type: string

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-zA-Z0-9_]+$'
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string

  responses:
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Could not validate credentials"
            code: "UNAUTHORIZED"

    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Validation error"
            code: "BAD_REQUEST"

    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Internal server error"
            code: "INTERNAL_ERROR"

tags:
  - name: ChatKit
    description: ChatKit protocol endpoints for chat functionality
  - name: Authentication
    description: User authentication and registration
