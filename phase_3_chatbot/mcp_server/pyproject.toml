[project]
name = "todo-ai-chatbot-mcp-server"
version = "0.1.0"
description = "MCP server for Todo AI Chatbot with standardized tool access"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29.0",
    "openai>=1.3.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]