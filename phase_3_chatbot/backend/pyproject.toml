[project]
name = "todo-ai-chatbot-backend"
version = "0.1.0"
description = "Backend service for Todo AI Chatbot with OpenAI Agents integration"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.16",
    "openai>=1.3.5",
    "openai-chatkit>=0.1.0",
    "openai-agents>=0.1.0",
    "mcp>=1.25",
    "pydantic[email]>=2.5.0",
    "python-multipart>=0.0.6",
    "better-exceptions>=0.3.3",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.7",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.2",
    "slowapi>=0.1.9",
    "bcrypt<4.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "isort>=5.12.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
]
