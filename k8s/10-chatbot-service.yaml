# ============================================
# KUBERNETES LEARNING PATH - STEP 10: CHATBOT SERVICE
# ============================================
# Service for Phase 3 Chatbot Backend
# Provides:
# 1. Stable internal IP (ClusterIP)
# 2. DNS name for service discovery
# 3. Load balancing across chatbot pods
# 4. Internal communication only

apiVersion: v1
kind: Service
metadata:
  name: todo-chatbot-service
  labels:
    app: todo-chatbot
spec:
  type: ClusterIP  # Internal only (not accessible from outside cluster)
  selector:
    app: todo-chatbot
  ports:
  - name: http
    protocol: TCP
    port: 7860        # Service port (what other pods call)
    targetPort: 7860  # Container port (what the chatbot listens on)

---
# NOTES FOR LEARNING:
# ===================
# Why ClusterIP for chatbot?
#
# 1. Internal Communication Only:
#    - Frontend → Chatbot Service → Chatbot Pod
#    - No external access needed (uses port-forward for dev)
#
# 2. Service Discovery:
#    - Frontend calls: http://todo-chatbot-service:7860
#    - Service automatically load balances to healthy pods
#
# 3. Stable Endpoint:
#    - Pods come and go (IPs change)
#    - Service IP/hostname stays the same
#
# Service Types Comparison:
# - ClusterIP: Internal only (default) ← Using this
# - NodePort: Exposed on each node's port (for testing)
# - LoadBalancer: Cloud provider external IP (for production)
#
# Communication Flow:
#   Frontend Pod
#       │
#       ▼ http://todo-chatbot-service:7860
#   todo-chatbot-service (ClusterIP)
#       │
#       ▼ Load balances
#   Chatbot Pod 1, Pod 2, ...
#
# Commands:
#   kubectl apply -f 10-chatbot-service.yaml
#   kubectl get svc todo-chatbot-service
#   kubectl describe svc todo-chatbot-service
