# ============================================
# KUBERNETES LEARNING PATH - STEP 5: SERVICES
# ============================================
# Services provide stable endpoints for Pods
# When Pods die/restart, their IPs change - Service IPs stay the same!

# Frontend Service
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-service
spec:
  type: ClusterIP  # Only accessible within cluster
  selector:
    app: todo-frontend
  ports:
  - port: 80
    targetPort: 3000
    name: http

# Backend Service
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-service
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
  - port: 8000           # Service listens on 8000
    targetPort: 7860     # Forwards to Pod's containerPort 7860
    name: http

---
# LEARNING:
# =========
# Now frontend can call backend via: http://todo-backend-service:8000
# No need to know Pod IPs! If backend pod restarts, Service still works.
#
# Service Discovery: K8s creates internal DNS records:
# - todo-frontend-service.default.svc.cluster.local
# - todo-backend-service.default.svc.cluster.local
#
# Short names work within same namespace:
# - todo-frontend-service
# - todo-backend-service
