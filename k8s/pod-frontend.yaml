apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  namespace: todo-app
  labels:
    app: todo-frontend
spec:
  containers:
  - name: frontend
    image: todo-frontend:local
    imagePullPolicy: Never
    ports:
    - containerPort: 3000
      name: http
    env:
    - name: NEXT_PUBLIC_API_URL
      valueFrom:
        configMapKeyRef:
          name: todo-config
          key: NEXT_PUBLIC_API_URL
    - name: NEXT_PUBLIC_CHATBOT_API_URL
      valueFrom:
        configMapKeyRef:
          name: todo-config
          key: NEXT_PUBLIC_CHATBOT_API_URL
    - name: PORT
      value: "3000"
    - name: NODE_ENV
      value: "production"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "250m"
