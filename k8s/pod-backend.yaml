apiVersion: v1
kind: Pod
metadata:
  name: backend-pod
  namespace: todo-app
  labels:
    app: todo-backend
spec:
  containers:
  - name: backend
    image: todo-backend:local
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
      name: http
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: todo-secret
          key: DATABASE_URL
    - name: BETTER_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: todo-secret
          key: BETTER_AUTH_SECRET
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: todo-secret
          key: OPENAI_API_KEY
    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: todo-config
          key: PORT
    - name: ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: todo-config
          key: ENVIRONMENT
    - name: FRONTEND_ORIGIN
      value: "http://frontend-service:3000"
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
