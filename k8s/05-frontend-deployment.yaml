apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      containers:
      - name: frontend
        image: todo-frontend:local
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        # Better Auth Secret (must match backend)
        - name: NEXT_PUBLIC_BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: todo-secret
              key: BETTER_AUTH_SECRET
        # API URLs - Internal cluster communication (frontend proxies all requests)
        - name: NEXT_PUBLIC_API_URL
          value: http://backend-service:8000
        - name: NEXT_PUBLIC_CHATBOT_API_URL
          value: http://backend-service:8000
        # Port
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
