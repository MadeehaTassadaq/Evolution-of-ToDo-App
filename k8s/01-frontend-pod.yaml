# ============================================
# KUBERNETES LEARNING PATH - STEP 1: POD
# ============================================
# A Pod is the SMALLEST deployable unit in K8s.
# Think of it as: "One or more containers that share the same network"
#
# Key Concept: Pod IP is TEMPORARY. If Pod dies, new Pod gets new IP.
# That's why we'll need Services later!

apiVersion: v1
kind: Pod
metadata:
  name: todo-frontend-pod
  labels:
    app: todo-frontend
    phase: frontend
spec:
  containers:
  - name: frontend
    image: madeeha456/todo-frontend:latest
    imagePullPolicy: Never  # Use local image (Docker Desktop shares images with K8s)
    ports:
    - containerPort: 3000    # Next.js runs on port 3000
      name: http
    env:
    - name: NEXT_PUBLIC_API_URL
      # TODO: We'll update this after creating backend service
      value: "http://todo-backend-service:8000"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

---
# NOTES FOR LEARNING:
# ===================
# 1. apiVersion: v1 → Core K8s API
# 2. kind: Pod → We're creating a single Pod
# 3. metadata.name → Name to reference this pod
# 4. metadata.labels → Key-value pairs for Service to find this Pod
# 5. spec.containers → Container definition
# 6. containerPort → Port container listens on (NOT exposed externally yet!)
# 7. resources → Memory/CPU limits (good practice)
