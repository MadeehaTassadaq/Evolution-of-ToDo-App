apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-app
  labels:
    app: todo-app
    component: secrets
type: Opaque
stringData:
  # ============================================
  # DATABASE CONFIGURATION
  # ============================================
  # Get from your Neon.tech dashboard or PostgreSQL provider
  # Format: postgresql://user:password@host:port/database?sslmode=require
  database-url: "postgresql://neondb_owner:YOUR_PASSWORD@ep-solitary-sunset-a4oczh67-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"

  # ============================================
  # OPENAI API KEY
  # ============================================
  # Get from: https://platform.openai.com/api-keys
  # Format: sk-proj-...
  openai-api-key: "sk-proj-your-openai-api-key-here"

  # ============================================
  # BETTER AUTH SECRET (JWT Signing Key)
  # ============================================
  # Generate a random string (min 32 characters)
  # You can use: openssl rand -base64 32
  better-auth-secret: "your-better-auth-secret-min-32-characters-long-change-this"

  # ============================================
  # OPENAI CHATKIT DOMAIN KEY
  # ============================================
  # Get from your ChatKit dashboard
  # Format: domain_pk_...
  openai-chatkit-domain-key: "domain_pk_your-chatkit-domain-key-here"
