# ============================================
# KUBERNETES SECRET TEMPLATE
# ============================================
# ⚠️  DO NOT COMMIT THIS FILE WITH REAL VALUES!
# 
# This is a TEMPLATE only. Copy this file and replace placeholder values:
#   cp 02-secret.template.yaml 02-secret.yaml
#   # Then edit 02-secret.yaml with your real credentials
#
# For production, use environment variables or external secret managers:
