# ============================================
# KUBERNETES MANIFEST - FRONTEND SERVICE
# ============================================
# Exposes the Next.js frontend via LoadBalancer
# DigitalOcean Kubernetes (DOKS) compatible

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: todo-app
  labels:
    app: todo-frontend
    component: frontend

spec:
  # Service type - LoadBalancer for external access
  type: LoadBalancer

  # Selector for pods to route traffic to
  selector:
    app: todo-frontend

  # Port configuration
  ports:
  - name: http
    protocol: TCP
    port: 80            # External port (what users connect to)
    targetPort: 3000    # Container port (where Next.js is listening)

  # Optional: Specify load balancer IP if you have a reserved one
  # loadBalancerIP: "your-reserved-ip-address"

  # Optional: Add annotations for DigitalOcean load balancer
  annotations:
    # DigitalOcean-specific annotations
    service.beta.kubernetes.io/do-loadbalancer-size: "lb-small"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "3"

---
# LEARNING NOTES:
# ===============
# LoadBalancer Service:
# - Creates a DigitalOcean Load Balancer ($$$ cost)
# - Automatically gets a public IP
# - Routes external traffic to the frontend pods
#
# Cost Considerations:
# - DigitalOcean Load Balancers: ~$10-20/month
# - Alternative: Use Ingress Controller (single LB for all services)
# - For cost savings, consider Ingress + ClusterIP services
#
# Service Discovery:
# - External: http://<load-balancer-ip> or http://your-domain.com
# - Internal: frontend-service.todo-app.svc.cluster.local:80
#
# Load Balancer Sizes:
# - lb-small: 10,000 concurrent connections
# - lb-medium: 100,000 concurrent connections
# - lb-large: 500,000 concurrent connections
#
# Getting the External IP:
# kubectl get svc frontend-service -n todo-app
# Look for EXTERNAL-IP column (shows 'pending' initially, then an IP)
#
# Setting Up Custom Domain:
# 1. Create an A record pointing to the LoadBalancer IP
# 2. Or use Ingress with TLS/SSL for automatic HTTPS
