# ============================================
# KUBERNETES MANIFEST - FRONTEND DEPLOYMENT
# ============================================
# Next.js 16 frontend with ChatKit widget integration
# DigitalOcean Kubernetes (DOKS) compatible

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: todo-app
  labels:
    app: todo-frontend
    component: frontend
    phase: phase2-3

spec:
  # Number of replica pods to run
  replicas: 2

  # Strategy for rolling updates
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Create 1 extra pod during update
      maxUnavailable: 0  # Don't make any pods unavailable

  # Selector for pods this deployment manages
  selector:
    matchLabels:
      app: todo-frontend

  # Pod template
  template:
    metadata:
      labels:
        app: todo-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        # Docker image - Replace with your registry
        # For local testing: your-registry/todo-frontend:latest
        # For DigitalOcean Registry: registry.digitalocean.com/your-registry/todo-frontend:latest
        image: todo-frontend:latest
        imagePullPolicy: IfNotPresent

        # Port configuration
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Environment variables
        env:
        # From ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: FRONTEND_PORT
        - name: NEXT_TELEMETRY_DISABLED
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: NEXT_TELEMETRY_DISABLED

        # API URLs - Point to internal backend service
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000"
        - name: NEXT_PUBLIC_CHATBOT_API_URL
          value: "http://backend-service:8000"

        # ChatKit Domain Key from secrets
        - name: NEXT_PUBLIC_OPENAI_DOMAIN_KEY
          valueFrom:
            secretKeyRef:
              name: todo-secrets
              key: openai-chatkit-domain-key

        # Health check - Liveness Probe
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Health check - Readiness Probe
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Resource limits and requests
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"

---
# LEARNING NOTES:
# ===============
# Next.js Standalone Build:
# - The Dockerfile must use 'output: "standalone"' in next.config.js
# - This creates a minimal production build (only ~100MB vs ~300MB)
# - Without standalone, the image would be much larger
#
# API URLs in Kubernetes:
# - Use internal service names (backend-service:8000)
# - NOT localhost:8000 (that's the container itself)
# - NOT external URLs (unnecessary latency)
#
# Build Requirements:
# - Ensure next.config.js has: output: "standalone"
# - Dockerfile must copy .next/standalone and .next/static
# - See: phase_2_web_App/frontend/Dockerfile
#
# Image Registry:
# - Build: docker build -t todo-frontend:latest ./phase_2_web_App/frontend
# - Tag: docker tag todo-frontend:latest registry.digitalocean.com/your-registry/todo-frontend:v1
# - Push: docker push registry.digitalocean.com/your-registry/todo-frontend:v1
