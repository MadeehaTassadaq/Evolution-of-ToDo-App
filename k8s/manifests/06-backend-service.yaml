# ============================================
# KUBERNETES MANIFEST - BACKEND SERVICE
# ============================================
# Exposes the FastAPI backend internally within the cluster
# DigitalOcean Kubernetes (DOKS) compatible

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: todo-app
  labels:
    app: todo-backend
    component: backend

spec:
  # Service type - ClusterIP for internal communication only
  type: ClusterIP

  # Selector for pods to route traffic to
  selector:
    app: todo-backend

  # Port configuration
  ports:
  - name: http
    protocol: TCP
    port: 8000          # Service port (what other services connect to)
    targetPort: 8000    # Container port (where the app is listening)

---
# LEARNING NOTES:
# ===============
# ClusterIP Service:
# - Only accessible within the Kubernetes cluster
# - Frontend connects to http://backend-service:8000
# - Not exposed to the internet (security best practice)
#
# Service Discovery:
# - Other pods can reach backend via DNS: backend-service.todo-app.svc.cluster.local
# - Short form within same namespace: backend-service
#
# Why ClusterIP?
# - Backend API doesn't need direct external access
# - Frontend serves as the gateway
# - Ingress will route /api/* requests to this service
#
# Alternative Types (not used here):
# - LoadBalancer: Exposes externally via DigitalOcean load balancer ($$$)
# - NodePort: Exposes on each node's IP at a static port
