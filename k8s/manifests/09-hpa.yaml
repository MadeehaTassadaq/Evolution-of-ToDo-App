# ============================================
# KUBERNETES MANIFEST - HORIZONTAL POD AUTOSCALER
# ============================================
# Automatically scales the number of pods based on CPU/memory usage
# DigitalOcean Kubernetes (DOKS) compatible

---
# Backend HPA - Scales the FastAPI backend pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: todo-app
  labels:
    app: todo-backend
    component: autoscaling

spec:
  # Which deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment

  # Minimum and maximum number of replicas
  minReplicas: 2
  maxReplicas: 10

  # Metrics for scaling decisions
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when CPU > 70%

  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale up when Memory > 80%

  # How fast to scale (optional)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
      - type: Percent
        value: 50        # Can scale down by 50% at a time
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0    # Scale up immediately
      policies:
      - type: Percent
        value: 100       # Can double pod count at a time
        periodSeconds: 15
      - type: Pods
        value: 2         # Or add 2 pods at a time
        periodSeconds: 15
      selectPolicy: Max   # Use the policy that allows more scaling

---
# Frontend HPA - Scales the Next.js frontend pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: todo-app
  labels:
    app: todo-frontend
    component: autoscaling

spec:
  # Which deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment

  # Minimum and maximum number of replicas
  minReplicas: 2
  maxReplicas: 5

  # Metrics for scaling decisions
  metrics:
  # Scale based on CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Scale based on memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  # How fast to scale
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
# LEARNING NOTES:
# ===============
# Horizontal Pod Autoscaler (HPA):
# - Automatically adjusts replica count based on metrics
# - Requires Metrics Server installed in cluster
# - Install: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Scaling Behavior:
# - Scale up: Immediate response to traffic spikes
# - Scale down: Gradual (waits 5 min to prevent flapping)
# - Stabilization window prevents rapid scale up/down cycles
#
# Metrics Server Requirements:
# - Must be installed for HPA to work
# - Check: kubectl get apiservice v1beta1.metrics.k8s.io
# - View metrics: kubectl top pods -n todo-app
#
# Testing HPA:
# - Generate load: kubectl run -i --tty load-generator --image=busybox /bin/sh
# - Watch replicas: kubectl get hpa -n todo-app -w
# - View events: kubectl describe hpa backend-hpa -n todo-app
#
# Cost Optimization:
# - minReplicas: 2 ensures high availability
# - maxReplicas limits cost during traffic spikes
# - Scale-down delay prevents unnecessary scaling
#
# DigitalOcean Considerations:
# - Node size limits maximum pods per node
# - Ensure you have enough node capacity for maxReplicas
# - Consider cluster autoscaler for node scaling
