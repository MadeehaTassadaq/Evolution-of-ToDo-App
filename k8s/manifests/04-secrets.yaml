# ============================================
# KUBERNETES MANIFEST - SECRETS
# ============================================
# Secrets store sensitive data (passwords, API keys, tokens)
# DigitalOcean Kubernetes (DOKS) compatible
#
# IMPORTANT: For production, use external secret managers!
# Options: DigitalOcean Secrets, HashiCorp Vault, AWS Secrets Manager
#
# SETUP INSTRUCTIONS:
# 1. Replace all placeholder values with actual secrets
# 2. Never commit this file with real secrets to git
# 3. Use kubectl create secret --dry-run for safer secret creation
#
# Example command to create secrets safely:
# kubectl create secret generic todo-secrets -n todo-app \
#   --from-literal=database-url="postgresql://..." \
#   --from-literal=openai-api-key="sk-proj-..." \
#   --from-literal=better-auth-secret="..." \
#   --from-literal=openai-chatkit-domain-key="domain_pk-..." \
#   --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: todo-app
  labels:
    app: todo-app
    component: secrets
type: Opaque
stringData:
  # Database connection
  database-url: "postgresql://neondb_owner:YOUR_PASSWORD@ep-solitary-sunset-a4oczh67-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"

  # OpenAI API key for Agents SDK
  openai-api-key: "sk-proj-your-openai-api-key-here"

  # JWT Secret Key (for FastAPI token verification)
  jwt-secret-key: "your-jwt-secret-key-min-32-chars"

  # Better Auth Secret (for JWT verification - compatible with Phase 2)
  better-auth-secret: "your-jwt-secret-key-min-32-chars"

  # OpenAI ChatKit Domain Key (for ChatKit widget authentication)
  openai-chatkit-domain-key: "your-openai-chatkit-domain-key"


  # Additional environment variables that can be set
  # These are optional and have defaults in the application
  # cors-allowed-origins: "https://yourdomain.com"
  # max-upload-size: "10485760"

---
# PRODUCTION DEPLOYMENT NOTES:
# ============================
# 1. DigitalOcean Kubernetes Secrets Management:
#    - Use DigitalOcean's secret management tools
#    - Consider external secret operators (sealed-secrets, external-secrets)
#    - Rotate secrets regularly
#
# 2. Secret creation best practices:
#    kubectl create secret generic todo-secrets -n todo-app \
#      --from-literal=database-url="$DATABASE_URL" \
#      --from-literal=openai-api-key="$OPENAI_API_KEY" \
#      --from-literal=better-auth-secret="$BETTER_AUTH_SECRET" \
#      --from-literal=openai-chatkit-domain-key="$DOMAIN_KEY"
#
# 3. Environment variable setup:
#    export DATABASE_URL="postgresql://..."
#    export OPENAI_API_KEY="sk-proj-..."
#    export BETTER_AUTH_SECRET="your-secret-min-32-chars"
#    export OPENAI_CHATKIT_DOMAIN_KEY="domain_pk-..."
#
# 4. Verify secrets after creation:
#    kubectl get secret todo-secrets -n todo-app -o yaml
#
# LEARNING NOTES:
# ===============
# - Better Auth uses BETTER_AUTH_SECRET for JWT verification
# - OpenAI API key is used for ChatKit Python SDK (gpt-3.5-turbo)
# - Domain key is registered for your production domain
# - Database URL should use sslmode=require for Neon PostgreSQL
