# Secrets store sensitive data (passwords, API keys, tokens)
# NOTE: For production, use external secret managers!

apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
type: Opaque
stringData:
  # Database connection
  database-url: "postgresql://neondb_owner:YOUR_PASSWORD@ep-solitary-sunset-a4oczh67-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"

  # OpenAI API key for Agents SDK
  openai-api-key: "sk-proj-your-openai-api-key-here"

  # JWT Secret Key (for FastAPI token verification)
  jwt-secret-key: "your-jwt-secret-key-min-32-chars"

  # Better Auth Secret (for JWT verification - compatible with Phase 2)
  better-auth-secret: "your-jwt-secret-key-min-32-chars"

  # OpenAI ChatKit Domain Key (for ChatKit widget authentication)
  openai-chatkit-domain-key: "your-openai-chatkit-domain-key"

---
# LEARNING NOTES:
# ===============
# Phase 3 backend uses BETTER_AUTH_SECRET (not JWT_SECRET_KEY)
# This allows it to verify tokens from Phase 2 Better Auth!
