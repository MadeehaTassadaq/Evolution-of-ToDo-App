# ============================================
# KUBERNETES LEARNING PATH - STEP 3: BACKEND POD
# ============================================
# Phase 3 Chatbot Backend with OpenAI Agents SDK

apiVersion: v1
kind: Pod
metadata:
  name: todo-backend-pod
  labels:
    app: todo-backend
    phase: backend
spec:
  containers:
  - name: backend
    image: madeeha456/todo-backend-phase3:latest
    imagePullPolicy: Never  # Use local image
    ports:
    - containerPort: 7860    # FastAPI runs on port 7860 (from Dockerfile ENV PORT=7860)
      name: http
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: database-url
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: openai-api-key
    - name: BETTER_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: todo-secrets
          key: better-auth-secret
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"

---
# NOTES FOR LEARNING:
# ===================
# We used valueFrom.secretKeyRef to load sensitive data from K8s Secrets
# This is more secure than hardcoding values in YAML!
# Next: We'll create the Secret YAML
